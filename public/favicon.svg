<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Luxury Charcoal Container Base -->
  <rect width="64" height="64" rx="16" fill="#1a1917"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Photographer Silhouette & Hair (Background Hump) -->
  <path d="M 18 24 C 18 12, 46 12, 46 24 C 52 28, 52 38, 48 42" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 22 16 C 30 10, 42 12, 44 18" stroke="#dfd3c3" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Main Camera Body Frame -->
  <rect x="16" y="22" width="34" height="20" rx="3.5" fill="#1a1917" stroke="url(#goldGradient)" stroke-width="2.5"/>
  <path d="M 27 18 L 37 18 L 40 22 L 24 22 Z" fill="url(#goldGradient)" opacity="0.9"/>
  <rect x="18" y="23.5" width="30" height="3" fill="#dfd3c3" opacity="0.8"/>

  <!-- Large Central Camera Lens Ring -->
  <circle cx="33" cy="32" r="8.5" fill="#1a1917" stroke="url(#goldGradient)" stroke-width="2.5"/>
  <circle cx="33" cy="32" r="5" fill="none" stroke="#dfd3c3" stroke-width="1.5" stroke-dasharray="3 1.5"/>
  <circle cx="33" cy="32" r="2.5" fill="url(#goldGradient)"/>
  <circle cx="31.5" cy="30.5" r="0.9" fill="#ffffff"/>

  <!-- Photographer Hands Holding Camera Body (Matching Image Reference) -->
  <!-- Left Hand Fingers on Side Grip -->
  <path d="M 8 20 C 13 20, 15 20, 16 20" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 7 24 C 13 24, 15 24, 16 24" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 8 28 C 13 28, 15 28, 16 28" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 10 32 C 14 32, 15 32, 16 32" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 6 36 L 15 48" stroke="url(#goldGradient)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Hand Cupping Under the Lens -->
  <path d="M 44 28 C 43 36, 40 44, 30 46 C 24 47, 20 44, 18 41" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 40 48 L 41 54" stroke="url(#goldGradient)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Gold Gradient Definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4dbe0"/>
      <stop offset="30%" stop-color="#dfd3c3"/>
      <stop offset="70%" stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#9a7b56"/>
    </linearGradient>
  </defs>
</svg>